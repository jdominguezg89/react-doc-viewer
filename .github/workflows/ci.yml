name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint and format (Biome)
        run: pnpm run check
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Pack (runs the build again through prepack)
        run: pnpm pack --pack-destination /tmp
      - name: Build Storybook
        run: pnpm storybook:build
      - name: Build the Next.js example against dist
        run: pnpm --filter react-doc-viewer-nextjs-example build
